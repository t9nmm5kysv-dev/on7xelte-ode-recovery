name: temp-fetch-wine-pr
on:
  pull_request:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install and collect static qemu-i386
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          QEMU=$(command -v qemu-i386-static || true)
          if [ -z "$QEMU" ]; then
            QEMU=$(find /usr -type f -name 'qemu-i386-static' -print -quit)
          fi
          test -n "$QEMU"
          cp "$QEMU" qemu-i386-static
          chmod 0755 qemu-i386-static
          sha256sum qemu-i386-static > SHA256SUMS.txt
          file qemu-i386-static
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-i386-static
          path: |
            qemu-i386-static
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
