name: temp-fetch-mobily-fw-package
on:
  pull_request:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch vendor firmware package
        run: |
          set -euxo pipefail
          mkdir capture
          page='https://unlockmyrouter.com/download/mobily_e5577s-932_fw_web/'
          curl -fL --retry 4 -A 'Mozilla/5.0' -c capture/cookies.txt -D capture/page-headers.txt -o capture/page.html "$page"
          python3 - <<'PY'
          from pathlib import Path
          import html,re
          s=Path('capture/page.html').read_text(errors='ignore')
          pats=[
            r'data-downloadurl="([^"]+)"',
            r'href="([^"]*wpdmdl=[^"]+)"',
            r"href='([^']*wpdmdl=[^']+)'",
          ]
          urls=[]
          for p in pats:
            urls += [html.unescape(x) for x in re.findall(p,s,re.I)]
          urls=list(dict.fromkeys(urls))
          Path('capture/candidates.txt').write_text('\n'.join(urls))
          if not urls: raise SystemExit('no download URL found')
          Path('capture/download-url.txt').write_text(urls[0])
          print(urls[0])
          PY
          url=$(cat capture/download-url.txt)
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' -b capture/cookies.txt -e "$page" -o capture/package.bin "$url"
          sha256sum capture/package.bin > capture/SHA256SUMS.txt
          file capture/package.bin > capture/file.txt
          ls -lh capture/package.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobily-fw-package
          path: capture
          compression-level: 0
          retention-days: 1
