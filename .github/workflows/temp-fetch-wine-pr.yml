name: temp-windows-extraction
on:
  pull_request:
    branches: [main]
jobs:
  extract:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download package and capture decrypted runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mobily-analysis'
          $out = Join-Path $root 'output'
          $pkg = Join-Path $root 'package'
          $dumps = Join-Path $out 'dumps'
          $newfiles = Join-Path $out 'new-files'
          New-Item -ItemType Directory -Force $root,$out,$pkg,$dumps,$newfiles | Out-Null

          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $pageUrl = 'https://unlockmyrouter.com/download/mobily-e5577s-932/'
          $page = Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri $pageUrl -Headers @{'User-Agent'='Mozilla/5.0'}
          [IO.File]::WriteAllText((Join-Path $out 'vendor-page.html'), $page.Content)
          $m = [regex]::Match($page.Content, 'data-downloadurl="([^"]*wpdmdl=15393[^"]*)"')
          if (-not $m.Success) { throw 'Live WPDM download endpoint not found' }
          $downloadUrl = [System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value)
          $downloadUrl | Set-Content (Join-Path $out 'download-url.txt')

          $download = Join-Path $pkg 'download.bin'
          Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri $downloadUrl -Headers @{'User-Agent'='Mozilla/5.0';'Referer'=$pageUrl} -OutFile $download
          Get-FileHash $download -Algorithm SHA256 | Format-List | Out-File (Join-Path $out 'download-hash.txt')
          Get-Item $download | Format-List * | Out-File (Join-Path $out 'download-metadata.txt')

          $sig = [IO.File]::ReadAllBytes($download)[0..7]
          $exe = $null
          if ($sig[0] -eq 0x50 -and $sig[1] -eq 0x4b) {
            Copy-Item $download (Join-Path $pkg 'package.zip')
            Expand-Archive -LiteralPath (Join-Path $pkg 'package.zip') -DestinationPath (Join-Path $pkg 'expanded') -Force
            $exe = Get-ChildItem (Join-Path $pkg 'expanded') -Recurse -File -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          } elseif ($sig[0] -eq 0x4d -and $sig[1] -eq 0x5a) {
            $exePath = Join-Path $pkg 'E5577s-932 Mobily.exe'
            Move-Item $download $exePath
            $exe = Get-Item $exePath
          } else {
            throw ('Downloaded object is neither ZIP nor PE. First bytes: ' + (($sig | ForEach-Object {$_.ToString('X2')}) -join ' '))
          }
          if (-not $exe) { throw 'No executable found in package' }
          $exe.FullName | Set-Content (Join-Path $out 'selected-exe.txt')
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List | Out-File (Join-Path $out 'exe-hash.txt')

          # Baseline temp files before execution.
          $start = Get-Date
          Get-ChildItem $env:TEMP -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTimeUtc |
            Export-Csv (Join-Path $out 'temp-before.csv') -NoTypeInformation

          # Block the protected program from making outbound connections.
          try {
            New-NetFirewallRule -DisplayName 'Temporary Mobily Extractor Block' -Direction Outbound -Action Block -Program $exe.FullName -Profile Any | Out-Null
          } catch { $_ | Out-String | Set-Content (Join-Path $out 'firewall-error.txt') }

          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;
          public static class Dumper {
            [DllImport("Dbghelp.dll", SetLastError=true)]
            static extern bool MiniDumpWriteDump(IntPtr hProcess, int processId, IntPtr hFile, uint dumpType, IntPtr exceptionParam, IntPtr userStreamParam, IntPtr callbackParam);
            public static bool Dump(System.Diagnostics.Process p, string path) {
              using (var fs = new FileStream(path, FileMode.Create, FileAccess.Write, FileShare.None)) {
                return MiniDumpWriteDump(p.Handle, p.Id, fs.SafeFileHandle.DangerousGetHandle(), 0x00001926, IntPtr.Zero, IntPtr.Zero, IntPtr.Zero);
              }
            }
          }
          '@

          $beforePids = @(Get-Process | Select-Object -ExpandProperty Id)
          $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          $proc.Id | Set-Content (Join-Path $out 'initial-pid.txt')
          $log = New-Object System.Collections.Generic.List[string]
          $dumped = @{}
          $deadline = (Get-Date).AddSeconds(45)
          $iteration = 0
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 350
            $iteration++
            $candidates = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              ($_.ProcessId -eq $proc.Id) -or
              ($beforePids -notcontains [int]$_.ProcessId -and ($_.ExecutablePath -like "$root*" -or $_.Name -match 'E5577|Mobily|Firmware|Update|Huawei'))
            }
            foreach ($c in $candidates) {
              try {
                $p = Get-Process -Id $c.ProcessId -ErrorAction Stop
                $key = "$($p.Id)-$iteration"
                if (($iteration -le 8 -or $iteration -in 12,20,35,60,90,120) -and -not $dumped.ContainsKey($key)) {
                  $dumpPath = Join-Path $dumps ("pid-{0}-iter-{1}.dmp" -f $p.Id,$iteration)
                  $ok = [Dumper]::Dump($p,$dumpPath)
                  $log.Add("$(Get-Date -Format o) dump pid=$($p.Id) iter=$iteration ok=$ok size=$((Get-Item $dumpPath -ErrorAction SilentlyContinue).Length)")
                  $dumped[$key] = $true
                }
              } catch { $log.Add("$(Get-Date -Format o) candidate pid=$($c.ProcessId) error=$($_.Exception.Message)") }
            }
            if ($proc.HasExited -and $iteration -gt 15 -and -not $candidates) { break }
          }
          $log | Set-Content (Join-Path $out 'dump-log.txt')
          Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Export-Csv (Join-Path $out 'processes-after.csv') -NoTypeInformation

          try { Get-Process -Id $proc.Id -ErrorAction SilentlyContinue | Stop-Process -Force } catch {}
          try { Remove-NetFirewallRule -DisplayName 'Temporary Mobily Extractor Block' -ErrorAction SilentlyContinue } catch {}

          # Copy files created or modified during execution from temp and package working tree.
          $roots = @($env:TEMP, $exe.DirectoryName)
          $seen = @{}
          foreach ($scanRoot in $roots) {
            Get-ChildItem $scanRoot -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.LastWriteTime -ge $start.AddSeconds(-2)} | ForEach-Object {
              if ($_.FullName -like "$out*") { return }
              if ($seen.ContainsKey($_.FullName)) { return }
              $seen[$_.FullName] = $true
              $safe = ($_.FullName -replace '[:\\/]+','_')
              try { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $newfiles $safe) -Force -ErrorAction Stop } catch {}
            }
          }
          Get-ChildItem $env:TEMP -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,CreationTimeUtc,LastWriteTimeUtc |
            Export-Csv (Join-Path $out 'temp-after.csv') -NoTypeInformation

          Get-ChildItem $out -Recurse -File | Get-FileHash -Algorithm SHA256 | Export-Csv (Join-Path $out 'output-hashes.csv') -NoTypeInformation
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath (Join-Path $root 'mobily-runtime-capture.zip') -CompressionLevel Optimal -Force
      - name: Upload runtime capture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobily-runtime-capture
          path: ${{ runner.temp }}/mobily-analysis/mobily-runtime-capture.zip
          compression-level: 0
          retention-days: 1
