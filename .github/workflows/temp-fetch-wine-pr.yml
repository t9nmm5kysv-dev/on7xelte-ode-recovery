name: temp-windows-extraction-lean
on:
  pull_request:
    branches: [main]
jobs:
  extract:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Capture one full runtime dump
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'mobily-lean'; $out=Join-Path $root 'output'; New-Item -ItemType Directory -Force $root,$out | Out-Null
          $s=New-Object Microsoft.PowerShell.Commands.WebRequestSession; $pageUrl='https://unlockmyrouter.com/download/mobily-e5577s-932/'
          $page=Invoke-WebRequest -UseBasicParsing -WebSession $s -Uri $pageUrl -Headers @{'User-Agent'='Mozilla/5.0'}
          $m=[regex]::Match($page.Content,'data-downloadurl="([^"]*wpdmdl=15393[^"]*)"'); if(!$m.Success){throw 'endpoint missing'}
          $url=[System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value); $bin=Join-Path $root 'download.bin'
          Invoke-WebRequest -UseBasicParsing -WebSession $s -Uri $url -Headers @{'User-Agent'='Mozilla/5.0';'Referer'=$pageUrl} -OutFile $bin
          $b=[IO.File]::ReadAllBytes($bin)
          if($b[0]-eq 0x50 -and $b[1]-eq 0x4b){$z=Join-Path $root 'package.zip';Move-Item $bin $z;$x=Join-Path $root 'expanded';Expand-Archive $z $x -Force;$exe=Get-ChildItem $x -Recurse -File -Filter '*.exe'|Sort-Object Length -Descending|Select-Object -First 1}
          elseif($b[0]-eq 0x4d -and $b[1]-eq 0x5a){$ep=Join-Path $root 'E5577s-932 Mobily.exe';Move-Item $bin $ep;$exe=Get-Item $ep}else{throw 'bad package'}
          Get-FileHash $exe.FullName -Algorithm SHA256|Format-List|Out-File (Join-Path $out 'exe-hash.txt')
          try{New-NetFirewallRule -DisplayName 'Temporary Mobily Extractor Block Lean' -Direction Outbound -Action Block -Program $exe.FullName -Profile Any|Out-Null}catch{}
          Add-Type -TypeDefinition @'
          using System;using System.IO;using System.Runtime.InteropServices;
          public static class D{[DllImport("Dbghelp.dll",SetLastError=true)]static extern bool MiniDumpWriteDump(IntPtr h,int i,IntPtr f,uint t,IntPtr e,IntPtr u,IntPtr c);public static bool Dump(System.Diagnostics.Process p,string s){using(var x=new FileStream(s,FileMode.Create,FileAccess.Write,FileShare.None))return MiniDumpWriteDump(p.Handle,p.Id,x.SafeFileHandle.DangerousGetHandle(),0x1926,IntPtr.Zero,IntPtr.Zero,IntPtr.Zero);}}
          '@
          $before=@(Get-Process|% Id);$start=Get-Date;$p0=Start-Process $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru;Start-Sleep -Milliseconds 3000
          $c=Get-CimInstance Win32_Process|?{$_.ProcessId-eq$p0.Id-or($before-notcontains[int]$_.ProcessId-and($_.ExecutablePath-like"$root*"-or$_.Name-match'E5577|Mobily|Firmware|Update|Huawei'))}|Select-Object -First 1
          if($c){$p=Get-Process -Id $c.ProcessId -ErrorAction Stop;$dp=Join-Path $out ("pid-{0}.dmp"-f$p.Id);[D]::Dump($p,$dp)|Out-File(Join-Path $out 'dump-result.txt')}
          Get-CimInstance Win32_Process|Select ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine|Export-Csv(Join-Path $out 'processes.csv')-NoTypeInformation
          $nf=Join-Path $out 'new-files';New-Item -ItemType Directory -Force $nf|Out-Null
          Get-ChildItem $env:TEMP -Recurse -File -ErrorAction SilentlyContinue|?{$_.LastWriteTime-ge$start.AddSeconds(-2)-and$_.FullName-notlike"$out*"}|%{$n=$_.FullName-replace'[:\\/]+','_';try{Copy-Item $_.FullName (Join-Path $nf $n)-Force}catch{}}
          try{Get-Process -Id $p0.Id -ErrorAction SilentlyContinue|Stop-Process -Force}catch{};try{Remove-NetFirewallRule -DisplayName 'Temporary Mobily Extractor Block Lean' -ErrorAction SilentlyContinue}catch{}
      - name: Upload lean capture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobily-runtime-lean
          path: ${{ runner.temp }}/mobily-lean/output
          compression-level: 0
          retention-days: 1
