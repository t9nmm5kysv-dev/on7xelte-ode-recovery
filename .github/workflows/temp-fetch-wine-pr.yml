name: temp-fetch-wine-pr
on:
  pull_request:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download portable Wine
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors -o wine.tar.xz \
            https://github.com/Kron4ek/Wine-Builds/releases/download/11.14/wine-11.14-amd64-wow64.tar.xz
          sha256sum wine.tar.xz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wine-runtime
          path: |
            wine.tar.xz
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
