name: temp-mobily-direct-vfs-copy
on:
  pull_request:
    branches: [main]
jobs:
  capture:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Open virtual files directly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'mobily-direct'; $expanded=Join-Path $root 'expanded'; $out=Join-Path $root 'output'
          New-Item -ItemType Directory -Force $root,$expanded,$out | Out-Null
          $s=New-Object Microsoft.PowerShell.Commands.WebRequestSession; $pageUrl='https://unlockmyrouter.com/download/mobily-e5577s-932/'
          $page=Invoke-WebRequest -UseBasicParsing -WebSession $s -Uri $pageUrl -Headers @{'User-Agent'='Mozilla/5.0'}
          $m=[regex]::Match($page.Content,'data-downloadurl="([^"]*wpdmdl=15393[^"]*)"'); if(!$m.Success){throw 'endpoint missing'}
          $url=[System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value); $bin=Join-Path $root 'download.bin'
          Invoke-WebRequest -UseBasicParsing -WebSession $s -Uri $url -Headers @{'User-Agent'='Mozilla/5.0';'Referer'=$pageUrl} -OutFile $bin
          $b=[IO.File]::ReadAllBytes($bin)
          if($b[0]-eq 0x50 -and $b[1]-eq 0x4b){$z=Join-Path $root 'package.zip';Move-Item $bin $z;Expand-Archive $z $expanded -Force;$exe=Get-ChildItem $expanded -Recurse -File -Filter '*.exe'|Sort-Object Length -Descending|Select-Object -First 1}
          elseif($b[0]-eq 0x4d -and $b[1]-eq 0x5a){$ep=Join-Path $expanded 'E5577s-932 Mobily.exe';Move-Item $bin $ep;$exe=Get-Item $ep}else{throw 'bad package'}
          Add-Type -TypeDefinition @'
          using System; using System.IO;
          public static class DirectCopy {
            public static string Copy(string src,string dst) {
              try { using(var i=new FileStream(src,FileMode.Open,FileAccess.Read,FileShare.ReadWrite|FileShare.Delete)) using(var o=new FileStream(dst,FileMode.Create,FileAccess.Write,FileShare.Read)) { i.CopyTo(o); return "OK len="+o.Length; } }
              catch(Exception e) { return "ERR "+e.GetType().FullName+" "+e.Message; }
            }
          }
          '@
          try{New-NetFirewallRule -DisplayName 'Temporary Mobily Direct Copy Block' -Direction Outbound -Action Block -Program $exe.FullName -Profile Any|Out-Null}catch{}
          $p=Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          $log=New-Object System.Collections.Generic.List[string]
          $targets=@(
            (Join-Path $expanded 'fw.bin'),
            (Join-Path $expanded 'flasher.exe'),
            ((Join-Path $expanded 'flasher.exe')+'\'),
            ('\\?\'+(Join-Path $expanded 'fw.bin')),
            ('\\?\'+(Join-Path $expanded 'flasher.exe'))
          )
          foreach($ms in @(100,250,500,1000,2000,4000,8000,12000,20000)){
            Start-Sleep -Milliseconds $ms
            foreach($src in $targets){
              $name=($src -replace '[:\\/\?]+','_')+'_'+$ms
              $dst=Join-Path $out $name
              $r=[DirectCopy]::Copy($src,$dst)
              $log.Add("ms=$ms src=$src result=$r")
              if($r.StartsWith('ERR')){Remove-Item $dst -Force -ErrorAction SilentlyContinue}
            }
          }
          $log|Set-Content(Join-Path $out 'direct-copy-log.txt')
          Get-ChildItem $out -File|Get-FileHash -Algorithm SHA256|Export-Csv(Join-Path $out 'hashes.csv')-NoTypeInformation
          try{Get-Process -Id $p.Id -ErrorAction SilentlyContinue|Stop-Process -Force}catch{}
          try{Remove-NetFirewallRule -DisplayName 'Temporary Mobily Direct Copy Block' -ErrorAction SilentlyContinue}catch{}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobily-direct-vfs-copy
          path: ${{ runner.temp }}/mobily-direct/output
          compression-level: 0
          retention-days: 1
