name: temp-reduce-mobily-21315-capture
on:
  pull_request:
    branches: [main]
jobs:
  reduce:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '8863424500'
    steps:
      - name: Download and reduce prior capture
        run: |
          set -euxo pipefail
          mkdir -p reduced/meta reduced/new-files
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > capture.zip
          python3 - <<'PY'
          from pathlib import Path
          import csv, re, shutil, zipfile
          z=zipfile.ZipFile('capture.zip')
          names=z.namelist()
          Path('reduced/meta/listing.txt').write_text('\n'.join(f'{i.filename}\t{i.file_size}\t{i.compress_size}' for i in z.infolist()))
          for name in names:
              base=Path(name).name.lower()
              if base in {'events.txt','processes.csv','hashes.csv','exe-hash.txt','selected-exe.txt'}:
                  out=Path('reduced/meta')/Path(name).name
                  out.write_bytes(z.read(name))
              elif '/new-files/' in name.replace('\\','/') and not name.endswith('/'):
                  data=z.read(name)
                  if len(data) <= 80*1024*1024:
                      (Path('reduced/new-files')/Path(name).name).write_bytes(data)
          dumps=[i for i in z.infolist() if i.filename.lower().endswith('.dmp')]
          if not dumps: raise SystemExit('no dumps found')
          def score(i):
              m=re.search(r'ms-(\d+)',i.filename)
              ms=int(m.group(1)) if m else 999999
              return (abs(ms-6000), ms, i.file_size)
          chosen=sorted(dumps,key=score)[0]
          Path('reduced/meta/selected-dump.txt').write_text(f'{chosen.filename}\n{chosen.file_size}\n')
          with z.open(chosen) as src, open('reduced/mobily-21315-selected.dmp','wb') as dst:
              shutil.copyfileobj(src,dst,1024*1024)
          PY
          sha256sum reduced/mobily-21315-selected.dmp reduced/new-files/* 2>/dev/null > reduced/SHA256SUMS.txt || true
          du -ah reduced | sort -h | tail -30
      - uses: actions/upload-artifact@v4
        with:
          name: mobily-21315-reduced
          path: reduced
          compression-level: 0
          retention-days: 1
