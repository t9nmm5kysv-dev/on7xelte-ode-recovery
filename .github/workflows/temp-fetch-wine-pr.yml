name: temp-fetch-e5577s-reference
on:
  pull_request:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download untouched Huawei reference firmware
        run: |
          set -euxo pipefail
          mkdir reference
          curl -fL --retry 5 --retry-all-errors -o reference/E5577s_Bs_21.327.62.00.1365.ZIP \
            'http://update.hicloud.com:8180/TDS/data/files/p9/s92/G247/g0/v89059/f1/full/E5577s_Bs_UPDATE_21.327.62.00.1365_WEBUI_17.100.18.00.1365_MRE5.ZIP'
          curl -fL --retry 5 --retry-all-errors -o reference/E5577s_Bs_21.318.03.01.1367.ZIP \
            'http://update.hicloud.com:8180/TDS/data/files/p9/s92/G247/g0/v87274/f1/full/E5577s_Bs_UPDATE_21.318.03.01.1367_WEBUI_17.100.17.01.1367_MRE5.ZIP'
          sha256sum reference/* > reference/SHA256SUMS.txt
          file reference/*
          ls -lh reference
      - uses: actions/upload-artifact@v4
        with:
          name: e5577s-reference-firmware
          path: reference
          compression-level: 0
          retention-days: 1
