name: temp-fetch-wine-pr
on:
  pull_request:
    branches: [main]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch vendor page and linked assets
        run: |
          set -euxo pipefail
          mkdir capture
          curl -fL --retry 3 -A 'Mozilla/5.0' \
            -D capture/headers.txt \
            -o capture/page.html \
            https://unlockmyrouter.com/download/mobily-e5577s-932/
          grep -Eo 'https?://[^"'"'<> ]+' capture/page.html | sort -u > capture/urls.txt || true
          grep -Eio 'href=["'"'][^"'"']+["'"']' capture/page.html | sort -u > capture/hrefs.txt || true
          grep -Ein 'download|file|ajax|wpdm|package|mobily|e5577' capture/page.html > capture/relevant.txt || true
          wc -c capture/page.html
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-page-capture
          path: capture
          retention-days: 1
