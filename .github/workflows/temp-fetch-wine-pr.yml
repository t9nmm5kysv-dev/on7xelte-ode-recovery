name: temp-windows-extraction
on:
  pull_request:
    branches: [main]
jobs:
  extract:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Capture protected runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mobily-analysis'
          $out = Join-Path $root 'output'
          $dumps = Join-Path $out 'dumps'
          $newfiles = Join-Path $out 'new-files'
          New-Item -ItemType Directory -Force $root,$out,$dumps,$newfiles | Out-Null

          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $pageUrl = 'https://unlockmyrouter.com/download/mobily-e5577s-932/'
          $page = Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri $pageUrl -Headers @{'User-Agent'='Mozilla/5.0'}
          $m = [regex]::Match($page.Content, 'data-downloadurl="([^"]*wpdmdl=15393[^"]*)"')
          if (-not $m.Success) { throw 'WPDM endpoint not found' }
          $url = [System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value)
          $download = Join-Path $root 'download.bin'
          Invoke-WebRequest -UseBasicParsing -WebSession $session -Uri $url -Headers @{'User-Agent'='Mozilla/5.0';'Referer'=$pageUrl} -OutFile $download
          Get-FileHash $download -Algorithm SHA256 | Format-List | Out-File (Join-Path $out 'download-hash.txt')

          $bytes = [IO.File]::ReadAllBytes($download)
          if ($bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4b) {
            $zip = Join-Path $root 'package.zip'; Move-Item $download $zip
            $expanded = Join-Path $root 'expanded'; Expand-Archive $zip $expanded -Force
            $exe = Get-ChildItem $expanded -Recurse -File -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          } elseif ($bytes[0] -eq 0x4d -and $bytes[1] -eq 0x5a) {
            $exePath = Join-Path $root 'E5577s-932 Mobily.exe'; Move-Item $download $exePath; $exe = Get-Item $exePath
          } else { throw 'Package is not ZIP or PE' }
          if (-not $exe) { throw 'EXE missing' }
          $exe.FullName | Set-Content (Join-Path $out 'selected-exe.txt')
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List | Out-File (Join-Path $out 'exe-hash.txt')

          $start = Get-Date
          try { New-NetFirewallRule -DisplayName 'Temporary Mobily Extractor Block' -Direction Outbound -Action Block -Program $exe.FullName -Profile Any | Out-Null } catch {}
          Add-Type -TypeDefinition @'
          using System; using System.IO; using System.Runtime.InteropServices;
          public static class Dumper {
            [DllImport("Dbghelp.dll", SetLastError=true)] static extern bool MiniDumpWriteDump(IntPtr h, int id, IntPtr f, uint t, IntPtr e, IntPtr u, IntPtr c);
            public static bool Dump(System.Diagnostics.Process p, string path) { using(var fs=new FileStream(path,FileMode.Create,FileAccess.Write,FileShare.None)) return MiniDumpWriteDump(p.Handle,p.Id,fs.SafeFileHandle.DangerousGetHandle(),0x1926,IntPtr.Zero,IntPtr.Zero,IntPtr.Zero); }
          }
          '@

          $before = @(Get-Process | Select-Object -ExpandProperty Id)
          $p0 = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          $p0.Id | Set-Content (Join-Path $out 'initial-pid.txt')
          $log = New-Object System.Collections.Generic.List[string]
          $times = @(150,400,800,1500,3000,6000,12000,22000,35000)
          $last = 0
          foreach ($target in $times) {
            Start-Sleep -Milliseconds ($target-$last); $last=$target
            $cands = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ProcessId -eq $p0.Id -or ($before -notcontains [int]$_.ProcessId -and ($_.ExecutablePath -like "$root*" -or $_.Name -match 'E5577|Mobily|Firmware|Update|Huawei'))
            }
            foreach ($c in $cands) {
              try {
                $p=Get-Process -Id $c.ProcessId -ErrorAction Stop
                $dp=Join-Path $dumps ("pid-{0}-ms-{1}.dmp" -f $p.Id,$target)
                $ok=[Dumper]::Dump($p,$dp)
                $log.Add("$(Get-Date -Format o) pid=$($p.Id) ms=$target ok=$ok size=$((Get-Item $dp).Length)")
              } catch { $log.Add($_.Exception.Message) }
            }
          }
          $log | Set-Content (Join-Path $out 'dump-log.txt')
          Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Export-Csv (Join-Path $out 'processes-after.csv') -NoTypeInformation
          try { Get-Process -Id $p0.Id -ErrorAction SilentlyContinue | Stop-Process -Force } catch {}
          try { Remove-NetFirewallRule -DisplayName 'Temporary Mobily Extractor Block' -ErrorAction SilentlyContinue } catch {}

          foreach ($scan in @($env:TEMP,$exe.DirectoryName)) {
            Get-ChildItem $scan -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.LastWriteTime -ge $start.AddSeconds(-2)} | ForEach-Object {
              if ($_.FullName -notlike "$out*") {
                $name=$_.FullName -replace '[:\\/]+','_'
                try { Copy-Item $_.FullName (Join-Path $newfiles $name) -Force } catch {}
              }
            }
          }
          $manifest = Get-ChildItem $out -Recurse -File | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 }
          $manifest | Export-Csv (Join-Path $root 'hashes.csv') -NoTypeInformation
          Move-Item (Join-Path $root 'hashes.csv') (Join-Path $out 'output-hashes.csv')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath (Join-Path $root 'mobily-runtime-capture.zip') -CompressionLevel Optimal -Force
      - name: Upload runtime capture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobily-runtime-capture
          path: ${{ runner.temp }}/mobily-analysis/mobily-runtime-capture.zip
          compression-level: 0
          retention-days: 1
